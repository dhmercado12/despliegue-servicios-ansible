---
- name: Instalar phpMyAdmin y su configuración para Apache
  ansible.builtin.package:
    name:
      - phpMyAdmin
      - phpMyAdmin-apache
    state: present

- name: Asegurar que Apache esté iniciado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true


- name: Instalar extensiones PHP necesarias
  community.general.zypper:
    name:
      - php8-mysqli
      - php8-mbstring
      - php8-gd
      - php8-zip
    state: present
  become: true

- name: Asegurar que Apache este iniciado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
  become: true

- name: Verificar respuesta HTTP de phpMyAdmin
  ansible.builtin.uri:
    url: http://localhost/phpMyAdmin
    method: GET
    status_code: 200
  register: phpmyadmin_http
  become: true

- name: Mostrar resultado de phpMyAdmin
  ansible.builtin.debug:
    msg: "phpMyAdmin responde correctamente por HTTP"
  when: phpmyadmin_http.status == 200
