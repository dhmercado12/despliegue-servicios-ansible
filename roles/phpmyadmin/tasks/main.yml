---
- name: Instalar phpMyAdmin y su configuración para Apache
  ansible.builtin.package:
    name:
      - phpMyAdmin
      - phpMyAdmin-apache
    state: present

- name: Asegurar que Apache esté iniciado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true


- name: Instalar extensiones PHP necesarias
  community.general.zypper:
    name:
      - php8-mysql
      - php8-mbstring
      - php8-gd
      - php8-zip
    state: present
  become: true

- name: Asegurar que Apache este iniciado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
  become: true
