---
- name: Instalar MariaDB
  community.general.zypper:
    name:
      - mariadb
      - mariadb-client
    state: present
  become: true

- name: Habilitar e iniciar MariaDB
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true
  become: true

- name: Instalar dependencia para administrar MariaDB
  community.general.zypper:
    name: python3-PyMySQL
    state: present
  become: true

- name: Crear usuario administrador de MariaDB
  community.mysql.mysql_user:
    name: admin
    host: localhost
    password: "mundolibre"
    priv: "*.*:ALL,GRANT"
    login_unix_socket: /run/mysql/mysql.sock
    state: present
  become: true
  no_log: true
  
- name: Crear base de datos
  community.mysql.mysql_db:
    name: empresa
    state: present
    login_unix_socket: /run/mysql/mysql.sock
  become: true

- name: Comprobar que MariaDB este activo
  ansible.builtin.command:
    cmd: systemctl is-active mariadb
  register: mariadb_estado
  changed_when: false
  become: true

- name: Mostrar estado de MariaDB
  ansible.builtin.debug:
    msg: "MariaDB esta {{ mariadb_estado.stdout }}"
