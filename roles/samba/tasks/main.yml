---
- name: Instalar Samba
  community.general.zypper:
    name:
      - samba
      - samba-client
    state: present

- name: Crear grupo para el recurso compartido
  ansible.builtin.group:
    name: sambashare
    state: present

- name: Crear usuario del sistema
  ansible.builtin.user:
    name: sambauser
    group: sambashare
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Crear usuario de Samba si no existe
  ansible.builtin.shell: |
    if pdbedit -L | cut -d: -f1 | grep -qx sambauser; then
      echo PRESENT
    else
      printf '%s\n%s\n' "$SMB_PASSWORD" "$SMB_PASSWORD" | smbpasswd -s -a sambauser && echo CREATED
    fi
  environment:
    SMB_PASSWORD: "{{ vault_samba_password }}"
  register: samba_user_result
  changed_when: "'CREATED' in samba_user_result.stdout"
  no_log: true


- name: Crear directorio compartido
  ansible.builtin.file:
    path: /srv/samba/compartido
    state: directory
    owner: sambauser
    group: sambashare
    mode: '2770'

- name: Instalar configuración de Samba
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar Samba

- name: Habilitar e iniciar Samba
  ansible.builtin.service:
    name: smb
    state: started
    enabled: true
