---
- name: Instalar Samba
  community.general.zypper:
    name:
      - samba
      - samba-client
    state: present

- name: Crear grupo para el recurso compartido
  ansible.builtin.group:
    name: sambashare
    state: present

- name: Crear usuario del sistema para Samba
  ansible.builtin.user:
    name: sambauser
    group: sambashare
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Crear o actualizar usuario de Samba
  ansible.builtin.shell: |
    if pdbedit -L | cut -d: -f1 | grep -qx sambauser; then
      printf '%s\n%s\n' "$SMB_PASSWORD" "$SMB_PASSWORD" | smbpasswd -s sambauser
    else
      printf '%s\n%s\n' "$SMB_PASSWORD" "$SMB_PASSWORD" | smbpasswd -s -a sambauser
    fi
  environment:
    SMB_PASSWORD: "{{ vault_samba_password }}"
  changed_when: true
  no_log: true

- name: Crear directorio compartido
  ansible.builtin.file:
    path: /srv/samba/compartido
    state: directory
    owner: sambauser
    group: sambashare
    mode: '2770'

- name: Instalar configuración de Samba
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar Samba

- name: Habilitar e iniciar Samba
  ansible.builtin.service:
    name: smb
    state: started
    enabled: true

- name: Consultar recursos compartidos de Samba
  ansible.builtin.command:
    cmd: smbclient -L localhost -U%
  register: samba_shares
  changed_when: false

- name: Mostrar recursos compartidos
  ansible.builtin.debug:
    var: samba_shares.stdout_lines

- name: Consultar permisos del directorio compartido
  ansible.builtin.stat:
    path: /srv/samba/compartido
  register: samba_directory

- name: Mostrar permisos del directorio
  ansible.builtin.debug:
    msg: "Permisos: {{ samba_directory.stat.mode }}"

- name: Crear archivo de prueba en el recurso compartido
  ansible.builtin.copy:
    dest: /srv/samba/compartido/prueba.txt
    content: "Recurso compartido configurado correctamente mediante Ansible."
    owner: sambauser
    group: sambashare
    mode: '0777'
